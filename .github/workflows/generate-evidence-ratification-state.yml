name: Generate evidence ratification Record state

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  generate-state:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/record-tr-oracle-evidence-ratification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Validate entries and generate derived state
        run: |
          set -euo pipefail
          npm run validate:record
          npm run check:supersession
          npm run build:state
          npm run generate:next-chat
          git diff --check

      - name: Commit generated state and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/generate-evidence-ratification-state.yml
          git add ecosystem/CURRENT_STATE.json ecosystem/CURRENT_STATE.md ecosystem/NEXT_CHAT_START.md
          git commit -m 'Generate evidence ratification derived state'
          git push origin HEAD:agent/record-tr-oracle-evidence-ratification
